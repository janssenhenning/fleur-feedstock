schema_version: 1

context:
  name: fleur
  version: "8.0"
  version_long: ${{ "MaX-R" + version }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/JuDFTteam/FLEUR/archive/refs/tags/${{ version_long }}.tar.gz
  sha256: 8ee4c8b2fd2c875e8ebcb1d49cbfb33b1a096899886576e063e56310b75ed0d2
  patches:
    - if: build_platform != target_platform
      then: patches/skip_mtune_native_cross.patch

build:
  number: 3
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - cmake <4
    - make
    - git
    - doxygen
    - python >=3
    - pytest
    - masci-tools
    - if: build_platform != target_platform
      then: openmpi
  host:
    - openmpi
    - scalapack
    - if: osx
      then: libblas
    - if: linux
      then: openblas * *openmp*
    - liblapack
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - libxml2-devel
    - fftw
    - hdf5 * *openmpi*
  run:
    - openmpi
    - scalapack
    - if: osx
      then: libblas
    - if: linux
      then: libblas * *openblas
    - if: linux
      then: openblas * *openmp*

tests:
  - script:
      - inpgen -version
      - if: unix
        then: test -f $PREFIX/bin/fleur_MPI

about:
  license: MIT
  license_file: LICENSE
  summary: A feature-full, freely available FLAPW (full-potential linearized augmented planewave) code, based on density-functional theory
  description: |
    The FLAPW-Method is an all-electron method which within density functional theory is universally applicable to all atoms of the periodic table and to systems with compact as well as open structures. It is widely considered to be the most precise electronic structure method in solid state physics.
    an optional C extension for a serious speed boost.
  homepage: https://www.flapw.de/
  repository: https://iffgit.fz-juelich.de/fleur/fleur
  documentation: https://www.flapw.de/

extra:
  recipe-maintainers:
    - mbercx
    - janssenhenning
